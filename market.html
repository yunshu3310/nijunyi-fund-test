<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倪俊毅基金测试 · 选择行情</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101318;color:#e8edf4;font-family:"Microsoft YaHei",sans-serif}header{padding:22px 32px;border-bottom:1px solid #2b3543;font-size:20px;font-weight:bold}main{max-width:1180px;padding:64px 24px;margin:auto}h1{font-size:32px;margin:0 0 12px}p{color:#8a96a8;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:36px}a.card{display:flex;flex-direction:column;min-height:290px;background:#151a21;border:1px solid #2b3543;padding:28px;color:inherit;text-decoration:none;transition:border-color .15s,background .15s}a.card:hover,a.card:focus-visible{border-color:#ffd24a;background:#1c222b;outline:none}.code{font:28px Consolas,monospace;color:#ffd24a}.name{font-size:18px;line-height:1.6;margin:20px 0;min-height:58px}.price{font:bold 34px Consolas,monospace;color:#ff414d}.message{font-size:12px;color:#8a96a8;margin:12px 0 24px}.enter{margin-top:auto;font-size:14px;color:#ffd24a}.note{font-size:12px;border-top:1px solid #2b3543;padding-top:24px;margin-top:36px}@media(max-width:800px){.cards{grid-template-columns:1fr}main{padding-top:36px}}
</style></head><body><header>倪俊毅基金测试</header><main><a href="index.html">← 返回量化工作台</a><h1>选择基金或指数</h1><p>查看当天开盘至今的成交价走势，以及实时买卖五档。</p><div class="cards" id="cards"></div><p class="note">最新成交价每秒尝试刷新，行情源可能延迟。基金数据分别采集、独立保存。</p></main><script src="market.js"></script><script>
const codes=['513310','515050','588170','000001'];const names={'513310':'中韩半导体ETF华泰柏瑞','515050':'通信ETF华夏','588170':'科创半导体ETF华夏','000001':'上证指数'};
for(const code of codes){const a=document.createElement('a');a.className='card';a.href='fund.html?code='+code;for(const [className,value] of [['code',code],['name',names[code]],['price','--'],['message','正在获取行情'],['enter','查看行情 →']]){const el=document.createElement('div');el.className=className;el.textContent=value;a.append(el)}a.id='fund-'+code;document.getElementById('cards').append(a)}
async function refresh(){try{const r=await marketFetch('/api/funds',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error();for(const fund of await r.json()){const card=document.getElementById('fund-'+fund.code);if(!card)continue;card.querySelector('.name').textContent=fund.name;card.querySelector('.price').textContent=fund.quote?fund.quote.price.toFixed(fund.code==='000001'?2:3):'--';card.querySelector('.message').textContent=fund.error||(fund.quote?'行情时间 '+fund.quote.quote_time.replace('T',' '):'等待行情')}}catch(e){document.querySelectorAll('.message').forEach(el=>el.textContent='连接失败，自动重试中')}finally{setTimeout(refresh,1000)}}refresh();
</script></body></html>
