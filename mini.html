:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101318;color:#e8edf4;font:13px "Microsoft YaHei",sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-bottom:1px solid #2b3543}h1{font-size:16px;margin:0}a{color:#ffd24a;text-decoration:none}main{padding:14px}form{display:flex;gap:8px}input{flex:1;min-width:0;background:#151a21;border:1px solid #344052;color:#e8edf4;padding:10px;font:14px Consolas,monospace;border-radius:3px}button{background:#ffd24a;border:0;color:#101318;border-radius:3px;padding:9px 13px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #ffd24a;outline-offset:2px}#miniStatus{font-size:11px;color:#8a96a8;line-height:1.8;padding:10px 0;min-height:36px}.quote-card{background:#151a21;border:1px solid #2b3543;padding:12px;margin-bottom:12px}.card-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.fund-link{color:#e8edf4;line-height:1.7;flex:1;min-width:0;overflow-wrap:anywhere}.fund-code{display:block;color:#8a96a8;font:11px Consolas,monospace}.delete-mini{background:transparent;color:#8a96a8;padding:4px 7px;font-size:11px;border:1px solid #344052}.card-price{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 5px;gap:12px}.latest{font:21px Consolas,monospace;color:#ff414d}.change{font:bold 22px Consolas,monospace}.spark{position:relative;height:95px}canvas{display:block;width:100%;height:100%}.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:#8a96a8;font-size:11px}.card-time{font-size:10px;color:#8a96a8;margin-top:5px;line-height:1.7}.empty-list{padding:35px 10px;text-align:center;color:#8a96a8;line-height:2}.note{color:#8a96a8;font-size:11px;line-height:1.8;margin-top:16px}

html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;font-size:11px}
header{padding:7px 10px;flex:0 0 33px;gap:8px}h1{font-size:13px}header a{font-size:10px}

form{gap:5px;flex:0 0 30px}input{padding:5px 7px;font-size:12px}button{padding:5px 9px;font-size:11px}

#miniCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:6px;flex:1;min-height:0}
.quote-card{margin:0;padding:6px 8px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}

.card-price{margin:3px 0 0;flex-shrink:0}.latest{font-size:12px}.change{font-size:22px;line-height:1.1}.spark{height:auto;flex:1;min-height:21px}.card-time{font-size:8px;margin-top:1px;line-height:1.1;flex-shrink:0}.chart-empty{font-size:9px}.note{font-size:9px;line-height:1.2;margin:4px 0 0;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.compact header,.compact #miniForm,.compact #miniStatus,.compact #miniPager,.compact .note,.compact .delete-mini,.compact .latest,.compact .card-time,.compact .fund-code{display:none!important}
.compact main{padding:4px;height:100%;min-height:0}

.compact .quote-card{display:grid;grid-template-columns:minmax(0,44%) minmax(0,56%);grid-template-rows:minmax(0,1fr) minmax(0,1fr);padding:4px 5px;gap:0;height:100%;min-height:0;position:relative}
.compact .card-top{grid-column:1;grid-row:1;min-height:0;overflow:hidden}
